[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "fathom-runtime-bin"
version = "0.0.0.dev0"
description = "Pinned Fathom runtime for the Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Fathom contributors" }]

[project.urls]
Homepage = "https://github.com/Pro-Nil/fathom"
Documentation = "https://github.com/Pro-Nil/fathom/blob/main/python/sdk-runtime/README.md"
Issues = "https://github.com/Pro-Nil/fathom/issues"
Source = "https://github.com/Pro-Nil/fathom"

# Include the injected executable and default config; exclude the dev-only node
# closure from wheels and sdists.
[tool.hatch.build]
artifacts = ["src/fathom_runtime/runtime/fathom-jsonrpc-agent-*"]
exclude = ["src/fathom_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/fathom_runtime"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
