# Bundled default config. The runtime still requires an explicit
# $FATHOM_CORDIS_CONFIG or argv path; the SDK injects this path for bundled
# zero-config launches. SDK-set session-root and cwd variables have manual-run fallbacks.

# Stdio JSON-RPC server entry; without it the agent has no SDK client.
- id: sdk-jsonrpc-server
  name: '@fathom/sdk-jsonrpc-server'

# Agent spine; the SDK server creates agents per sessionId.
- id: agent-core
  name: '@fathom/agent-spine-demo'
  config:
    workspaceContext:
      maxBytes: 65536

# No model adapter is mounted here: the SDK server's initialize mounts one
# OpenAI-compatible pi-ai route for the requested provider at $LLM_BASE_URL,
# keyed by $LLM_API_KEY, so this file names no secret and no route.

# JSONL persistence; $FATHOM_SESSION_ROOT wins over ./.sessions in the process cwd.
- id: sessions
  name: '@fathom/session-persistence-jsonl'
  config:
    root: !!js process.env.FATHOM_SESSION_ROOT ?? './.sessions'

# Persistence owns durable storage; this separate policy explicitly selects
# the request, tool-dispatch, and completed-step durability checkpoints.
- id: session-checkpoints
  name: '@fathom/session-checkpoint-policy'

# Local bash executor; $FATHOM_CWD wins over the process cwd.
# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@fathom/subprocess-local'

- id: bash
  name: '@fathom/bash-local'
  config:
    cwd: !!js process.env.FATHOM_CWD ?? process.cwd()

# Local filesystem provider for workspace instruction loading. This does not
# expose model-facing file tools by itself.
- id: fs-local
  name: '@fathom/fs-local'
  config:
    cwd: !!js process.env.FATHOM_CWD ?? process.cwd()
