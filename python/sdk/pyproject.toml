[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "fathom-sdk"
version = "0.0.0.dev0"
description = "Python SDK for Fathom"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Fathom contributors" }]
dependencies = [
  "pydantic>=2.12,<3",
  "fathom-runtime-bin==0.0.0.dev0",
]

[project.urls]
Homepage = "https://github.com/Pro-Nil/fathom"
Documentation = "https://github.com/Pro-Nil/fathom/blob/master/docs/user/guide/python-sdk.md"
Issues = "https://github.com/Pro-Nil/fathom/issues"
Source = "https://github.com/Pro-Nil/fathom"

[dependency-groups]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/fathom"]

# Editable installs see runtime executables injected after installation instead
# of freezing a wheel snapshot.
[tool.uv.sources]
fathom-runtime-bin = { path = "../sdk-runtime", editable = true }
