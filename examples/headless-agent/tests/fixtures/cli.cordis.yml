- id: cli-mock-llm
  name: './cli-mock-llm.ts'

- id: base
  name: '@fathom/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-pi-ai
        name: '@fathom/llm-pi-ai'
        disabled: true
      - id: agent-spine
        name: '@fathom/agent-spine-demo'
        config:
          agents:
            - id: main
              provider: cli-mock
              model: cli-mock
              cwd: !!js process.cwd()
          workspaceContext: false
          fathomHome: './.fathom-home'
          skills:
            filesystem:
              agentsHome: './.agents-home'
          persona: 'Keyless headless-agent smoke.'
      - id: persistence
        name: '@fathom/session-persistence-jsonl'
        config:
          root: './.sessions'
