# Keyless context-overflow composition for the assembled compaction snapshot.
- id: base
  name: '@fathom/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-pi-ai
        name: '@fathom/llm-pi-ai'
        disabled: true
      - id: compaction-basic
        name: '@fathom/compaction-basic'
        config:
          thresholdRatio: 0.99
          retainTokens: 20
          maxTokens: 32
      - insert:
          - id: llm-replay
            name: '@fathom/llm-replay'
            config:
              providers:
                - id: acme-official
                  models:
                    - id: acme-v4-flash
                      contextWindow: 128000
