# Keyless opt-in PTY composition for the headless stream-json snapshot.
- id: base
  name: '@fathom/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-pi-ai
        name: '@fathom/llm-pi-ai'
        disabled: true
      - insert:
          - id: sandbox-policy
            name: '@fathom/sandbox-policy'
            config:
              mode: danger-full-access
          - id: pty
            name: '@fathom/terminal'
          - id: pty-snapshot-backend
            name: '../acp-agent/pty-snapshot-backend.mjs'
          - id: tool-terminal
            name: '@fathom/tool-terminal'
            config:
              maxResultBytes: 64
          - id: llm-replay
            name: '@fathom/llm-replay'
