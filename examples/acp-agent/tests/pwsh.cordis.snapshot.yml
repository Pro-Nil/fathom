# Minimal keyless composition: real app, pwsh executor, and pwsh tool; replayed model.
- id: llm-replay
  name: '@fathom/llm-replay'
  config:
    providers:
      - id: acme-official
        name: Acme
        models:
          - id: acme-v4-pro

- id: subprocess
  name: '@fathom/subprocess-local'

- id: bash
  name: '@fathom/pwsh-local'

- id: shell-env
  name: '@fathom/shell-env'

- id: acp-agent
  name: '@fathom/acp-demo'
  config:
    provider: acme-official
    model: acme-v4-pro
    persistenceRoot: !!js process.env.FATHOM_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: none
    workspaceContext: false
    skills:
      enabled: false
    # job_output/job_kill stay mounted (the bundle's toolJobs default) so
    # background pwsh runs are readable and killable.
    goals: false
    # The pwsh tool replaces the bundle's bash tool in this composition.
    toolBash: false
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: tool-pwsh
  name: '@fathom/tool-pwsh'
