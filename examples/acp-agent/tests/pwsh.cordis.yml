# Minimal live counterpart for the pwsh-tool-turn snapshot composition.
- id: llm-pi-ai
  name: '@pentest-harness/dsh-llm-pi-ai'
  config:
    providers:
      acme-official:
        displayName: Acme
        api: openai-completions
        baseURL: !!js process.env.ACME_BASE_URL ?? 'https://api.acme.test/v1'
        apiKeyEnv: ACME_API_KEY
        models:
          - id: acme-v4-pro

- id: subprocess
  name: '@pentest-harness/dsh-subprocess-local'

- id: bash
  name: '@pentest-harness/dsh-pwsh-local'

- id: shell-env
  name: '@pentest-harness/dsh-shell-env'

- id: acp-agent
  name: '@pentest-harness/dsh-acp-demo'
  config:
    provider: acme-official
    model: acme-v4-pro
    persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"
    workspaceContext: false
    skills:
      enabled: false
    # job_output/job_kill stay mounted (the bundle's toolJobs default) so
    # background pwsh runs are readable and killable.
    goals: false
    # The pwsh tool replaces the bundle's bash tool in this composition.
    toolBash: false
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: tool-pwsh
  name: '@pentest-harness/dsh-tool-pwsh'
