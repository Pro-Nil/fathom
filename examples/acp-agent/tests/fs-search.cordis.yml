# Minimal live counterpart for the glob-sampling snapshot composition.
- id: llm-pi-ai
  name: '@fathom/llm-pi-ai'
  config:
    providers:
      acme-official:
        displayName: Acme
        api: openai-completions
        baseURL: !!js process.env.ACME_BASE_URL ?? 'https://api.acme.test/v1'
        apiKeyEnv: ACME_API_KEY
        models:
          - id: acme-v4-pro

- id: subprocess
  name: '@fathom/subprocess-local'

- id: bash
  name: '@fathom/bash-local'

- id: acp-agent
  name: '@fathom/acp-demo'
  config:
    provider: acme-official
    model: acme-v4-pro
    persistenceRoot: !!js process.env.FATHOM_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: !!js "process.env.FATHOM_SNAPSHOT === undefined ? 'zstd' : 'none'"
    workspaceContext: false
    skills:
      enabled: false
    toolJobs: false
    goals: false
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: tool-fs-search
  name: '@fathom/tool-fs-search'
  config:
    sampleOverCapGlobResults: true
    globMaxResults: 4
