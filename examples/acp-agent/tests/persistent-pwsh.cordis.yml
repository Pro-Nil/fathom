# Minimal live counterpart for the persistent-pwsh-tool-turn snapshot composition.
- id: llm-pi-ai
  name: '@pentest-harness/dsh-llm-pi-ai'
  config:
    providers:
      acme-official:
        displayName: Acme
        api: openai-completions
        baseURL: !!js process.env.ACME_BASE_URL ?? 'https://api.acme.test/v1'
        apiKeyEnv: ACME_API_KEY
        models:
          - id: acme-v4-pro

- id: sandbox-policy
  name: '@pentest-harness/dsh-sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@pentest-harness/dsh-subprocess-local'

- id: terminal
  name: '@pentest-harness/dsh-terminal'

- id: terminal-pwsh
  name: '@pentest-harness/dsh-terminal-bash'
  config:
    shellDialect: pwsh
    timeoutMs: 30000

- id: acp-agent
  name: '@pentest-harness/dsh-acp-demo'
  config:
    provider: acme-official
    model: acme-v4-pro
    persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: tool-pwsh-persistent
  name: '@pentest-harness/dsh-tool-pwsh-persistent'
