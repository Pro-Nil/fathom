# Keyless replay counterpart to persistent-pwsh.cordis.yml.
- id: llm-replay
  name: '@fathom/llm-replay'
  config:
    providers:
      - id: acme-official
        name: Acme
        models:
          - id: acme-v4-pro

- id: terminal
  name: '@fathom/terminal'

- id: sandbox-policy
  name: '@fathom/sandbox-policy'
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@fathom/subprocess-local'

- id: terminal-pwsh
  name: '@fathom/terminal-bash'
  config:
    shellDialect: pwsh
    timeoutMs: 30000

- id: acp-agent
  name: '@fathom/acp-demo'
  config:
    provider: acme-official
    model: acme-v4-pro
    persistenceRoot: !!js process.env.FATHOM_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: none
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: tool-pwsh-persistent
  name: '@fathom/tool-pwsh-persistent'
