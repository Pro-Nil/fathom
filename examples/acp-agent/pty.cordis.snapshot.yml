# Keyless replay counterpart to pty.cordis.yml.
- id: base
  name: '@pentest-harness/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-pi-ai
        name: '@pentest-harness/dsh-llm-pi-ai'
        disabled: true
      - insert:
          - id: pty
            name: '@pentest-harness/dsh-terminal'
          - id: pty-snapshot-backend
            name: './pty-snapshot-backend.mjs'
          - id: tool-terminal
            name: '@pentest-harness/dsh-tool-terminal'
            config:
              maxResultBytes: 64
          - id: llm-replay
            name: '@pentest-harness/dsh-llm-replay'
            config:
              providers:
                - id: acme-official
                  name: Acme
                  models:
                    - id: acme-v4-flash
                    - id: acme-v4-pro
