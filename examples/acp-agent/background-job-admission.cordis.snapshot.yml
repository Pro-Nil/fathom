# Keyless counterpart to background-job-admission.cordis.yml: replace the
# Acme adapter with replay while preserving the app's one-task admission
# config and the recorded flash route.
- id: base
  name: '@pentest-harness/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-pi-ai
        name: '@pentest-harness/dsh-llm-pi-ai'
        disabled: true
      - id: acp-agent
        name: '@pentest-harness/dsh-acp-demo'
        config:
          provider: acme-official
          model: acme-v4-flash
          persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          tasks:
            maxConcurrentJobsPerOwner: 1
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: llm-replay
            name: '@pentest-harness/dsh-llm-replay'
            config:
              providers:
                - id: acme-official
                  name: Acme
                  models:
                    - id: acme-v4-flash
                    - id: acme-v4-pro
