# Replay counterpart to advanced.cordis.yml; only the live model is replaced.
- id: base
  name: '@fathom/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-pi-ai
        name: '@fathom/llm-pi-ai'
        disabled: true
      - id: acp-agent
        name: '@fathom/acp-demo'
        config:
          provider: acme-official
          model: acme-v4-flash
          persistenceRoot: !!js process.env.FATHOM_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: 'none'
          workspaceContext:
            maxBytes: 65536
          tools:
            mode: both
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: code-runtime
            name: '@fathom/code-runtime-worker-thread'
          - id: cordis-host-runner
            name: '@fathom/cordis-host-runner'
          - id: tool-cordis
            name: '@fathom/tool-cordis'
          - id: llm-replay
            name: '@fathom/llm-replay'
            config:
              providers:
                - id: acme-official
                  name: Acme
                  models:
                    - id: acme-v4-flash
                    - id: acme-v4-pro
