# Keyless replay includes the live `cordis.yml`, disables the key-requiring
# Acme adapter, and inserts `llm-replay` to serve recorded JSONL without a
# key or network; every other entry remains shared. The replay provider
# catalog claims the `acme-official` provider so the SDK server's `initialize`
# finds it owned and never mounts the real-adapter fallback. The SDK snapshot
# suite passes this path explicitly through `FATHOM_CORDIS_CONFIG` (the
# jsonrpc-demo bin performs no FATHOM_SNAPSHOT config swap of its own), and
# `llm-replay` reads `FATHOM_SNAPSHOT_FILE` / `FATHOM_SNAPSHOT_CHILD_FILES` from the
# harness. Stdout remains reserved for JSON-RPC frames.
- id: base
  name: '@fathom/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      # `name` asserts the target: a mismatch skips the patch and warns only
      # when a logger exists.
      - id: llm-pi-ai
        name: '@fathom/llm-pi-ai'
        disabled: true
      - insert:
          - id: llm-replay
            name: '@fathom/llm-replay'
            config:
              providers:
                - id: acme-official
                  name: Acme
                  models:
                    - id: acme-v4-flash
