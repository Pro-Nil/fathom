# Keyless replay keeps the complete minimal composition intact and replaces
# only its live Acme adapter with the fixture-backed provider. The replay
# catalog claims the same route initialized by the SDK.
- id: base
  name: '@pentest-harness/cordis-plugin-include'
  config:
    path: ./minimal.cordis.yml
    patches:
      - id: llm-pi-ai
        name: '@pentest-harness/dsh-llm-pi-ai'
        disabled: true
      - insert:
          - id: llm-replay
            name: '@pentest-harness/dsh-llm-replay'
            config:
              providers:
                - id: acme-official
                  name: Acme
                  models:
                    - id: acme-v4-flash
