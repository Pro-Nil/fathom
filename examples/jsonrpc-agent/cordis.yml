# Unattended coding-agent deployment for the bundled fathom-jsonrpc-agent runtime.
# stdout is reserved for JSON-RPC; do not add a console logger or terminal UI.

- id: sdk-jsonrpc-server
  name: '@fathom/sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: !!js "process.env.FATHOM_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.FATHOM_MAX_TOKENS_AS_SUCCESS)"

# The Acme adapter. Shipped default: full thinking at max effort on every
# request; exact-model resolution materializes request defaults before logging.
# The model arrives per session over JSON-RPC, so it is not pinned here.
- id: llm-pi-ai
  name: '@fathom/llm-pi-ai'
  config:
    providers:
      acme-official:
        displayName: Acme
        api: openai-completions
        baseURL: !!js process.env.ACME_BASE_URL ?? 'https://api.acme.test/v1'
        apiKeyEnv: ACME_API_KEY
        reasoning: xhigh
        models:
          - id: acme-v4-flash
          - id: acme-v4-pro

# Managed child-process groups for the bash executor (spawn/kill/output plumbing).
- id: subprocess
  name: '@fathom/subprocess-local'

- id: bash
  name: '@fathom/bash-local'
  config:
    cwd: !!js process.env.FATHOM_CWD ?? process.cwd()
    timeoutMs: 60000

- id: agent-spine
  name: '@fathom/agent-spine-demo'
  config:
    persona: !!js process.env.FATHOM_SYSTEM_PROMPT ?? 'You are a coding agent.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: sessions
  name: '@fathom/session-persistence-jsonl'
  config:
    root: !!js process.env.FATHOM_SESSION_ROOT ?? './.sessions'
    # Snapshot runs read the raw JSONL back; production keeps zstd frames.
    compression: !!js "process.env.FATHOM_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-checkpoints
  name: '@fathom/session-checkpoint-policy'

- id: subagent
  name: '@fathom/subagent'

- id: subagent-spawn-in-process
  name: '@fathom/subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@fathom/tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@fathom/tool-todo'
  config:
    allowParallelInProgress: true

- id: fs-local
  name: '@fathom/fs-local'
  config:
    cwd: !!js process.env.FATHOM_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@fathom/fs-observation-policy'

- id: tool-fs
  name: '@fathom/tool-fs'

- id: token-meter
  name: '@fathom/token-meter'

- id: compaction-basic
  name: '@fathom/compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
