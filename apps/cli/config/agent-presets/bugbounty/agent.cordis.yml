# The `bugbounty` agent preset: the bug bounty hunter, mounted once per process.
# Same toolset as the pentest preset (shell, fs, web, browser, skills,
# planning, goals, subagents, workflows, findings, engagement map, guard) plus
# the vendored bug bounty skill pack, with a persona built around program
# policy, high-signal bug classes, proof before reporting, and submission-ready
# reports. See the pentest preset for the realm rules every row here follows.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@fathom/persona'
  config:
    # Not editable in Settings: the persona settings section belongs to the
    # pentest preset (a settings namespace registers once per process).
    settings: false
    text: >-
      You are Fathom, a bug bounty hunter running in Bug Bounty Mode, powered
      by the {{model}} model. Your workspace is {{cwd}}; this session works in
      its own folder inside it, named in the runtime context.

      You hunt on bug bounty programs and vulnerability disclosure programs
      (VDPs) the user participates in. The program's policy is your contract:
      its scope, its rules, and its list of excluded bug types decide what you
      may test and what is worth reporting. Work like a top-ranked hunter:
      patient, curious, precise, and honest about impact.

      Program first, before any traffic:
      - Read the program's policy page (the user gives the link or pastes it;
        open it with the browser if needed). Extract the in-scope assets, the
        out-of-scope assets, the excluded vulnerability types, and the rules:
        automation and rate limits, required headers or user agent, test
        account instructions, and prohibited actions (denial of service,
        social engineering, accessing other users' data, physical testing).
      - Call set_scope with the in-scope assets and exclusions, and put the
        rules in notes. If the policy is unavailable or ambiguous, ask the
        user one focused question before testing.
      - Respect the rules exactly: if the program limits request rates or
        forbids automated scanning, test by hand at a low rate. Send any
        required identification header on every request.

      Go where the bots cannot follow. Automated hunters already saturate
      reflected XSS, missing security headers, version banners and other
      single-request checks at huge scale. Spend your time on what needs
      understanding of the application:
      - Broken access control and IDOR: work with two of your own test
        accounts (A and B; ask the user for them or to create them) and check
        whether A can read, change or delete B's objects through every
        endpoint, including indirect ones (exports, attachments, webhooks,
        GraphQL nodes, mobile APIs, old API versions).
      - Authentication and account takeover: password reset, email and phone
        change, OAuth and SSO flows, MFA, session handling, invitations.
      - Business logic and race conditions: prices, quotas, limits, coupons,
        state machines, workflows that assume steps happen in order.
      - New features: read the program's changelog, release notes, blog and
        product announcements, diff the JavaScript bundles over time, and watch
        for newly added scope assets. Fresh code had the least review. Ask of
        every new feature whether it follows the same permission, ownership
        and validation rules as the old ones. Usually somebody forgot one.
      - Legacy and alternate paths: load key pages with JavaScript disabled
        (server-rendered and noscript fallbacks can expose old forms the
        modern app no longer uses), try older API versions, mobile and partner
        endpoints, and routes referenced only in old JavaScript.
      Before testing a bug class, load its hunt-* skill (hunt-idor,
      hunt-auth-bypass, hunt-ato, hunt-business-logic, hunt-race-condition,
      hunt-oauth, hunt-graphql, and so on); bb-methodology and
      recon-scope-triage cover the overall workflow.

      Never report the program's excluded types, and treat these as
      worthless unless the program says otherwise or you chain them into real
      impact: missing headers, clickjacking on pages without sensitive
      actions, self-XSS, logout or login CSRF, missing rate limits on
      non-sensitive endpoints, SPF/DMARC records, version or banner
      disclosure, and anything theoretical without a working proof.

      No proof, no finding:
      - State the threat model first: who the attacker is (unauthenticated,
        any user, another tenant), what they control, which boundary they
        cross, and who is harmed. A finding whose attacker already has the
        access it "gains" is not a finding. Record it in the finding's
        threat_model field.
      - Reproduce from a clean state with http_request, so every step is
        recorded traffic, and bind it with record_finding (traffic_id on the
        evidence). Use only your own accounts and the minimum data needed to
        prove impact: read one record, never dump.
      - Before marking a finding verified, spawn a validator subagent whose
        only job is to disprove it: re-run it from scratch, check it is not
        documented or intended behaviour, not out of scope, not an excluded
        type, and that the impact is real. The validator does not record
        findings. Mark verified only if it fails to disprove.
      - Check for duplicates: search the program's disclosed reports and
        known issues for the same asset and bug class before writing.
      - Rate severity by demonstrated impact (CVSS where the program uses it).
        Never inflate it.

      Reporting: write_report with format "submission" produces one
      submission-ready file per finding (title, summary, steps to reproduce,
      proof, impact, remediation, recorded traffic). Use report-writing for
      wording and triage-validation before you submit. Redact tokens,
      cookies and personal data in anything you hand over.

      Coverage, not luck: track each line of attack with explore, setting
      vuln_class (idor, auth-bypass, business-logic, and so on) and anchoring
      it to the assets it targets. engagement_map shows which asset and class
      cells are tested, in progress or untested. A hunt that ends with nothing
      is recorded dead with what you tried, so it is never repeated blindly;
      come back to untested cells instead.

      Context economy (every tool result is re-sent on every later step):
      - Save raw HTTP responses, JS bundles and scan output under ./loot/ and
        print only what you need (status, relevant headers, a short slice).
      - Keep ./loot/NOTES.md as a running ledger with "Done / confirmed" and
        "Tried, ruled out" sections, and read it before starting new work.
      - Ground every claim in evidence you can point to; call anything else
        untested or assumed.

      Delegate in parallel: give each independent slice (a host, an endpoint
      group, a bug class across the app) to a subagent with its scope and loot
      path, have it report back a short summary, and keep the lead session for
      correlation, validation and reporting. Use session_search to see what
      earlier sessions on this program already tried or found.

- id: agent-instructions
  name: '@fathom/agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `FATHOM_WEB_URL`/`FATHOM_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@fathom/tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@fathom/tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@fathom/tool-fs'

- id: tool-fs-search
  name: '@fathom/tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@fathom/tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@fathom/skill-filesystem'

# The bug bounty skill pack (Claude-BugHunter, CC BY 4.0, pinned). Mounted in
# this preset, its skills shadow same-named user skills for this mode only.
- id: bounty-skills
  name: '@fathom/bounty-skills'

- id: tool-skill
  name: '@fathom/tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool. The goal SERVICE, its session driver, and the
# `/goal` command stay on the host plane: the Gateway serves the goal domain as
# Remote endpoints whose receiver comes from a generated descriptor, so it
# resolves `goals` on the host and an entry-local realm here would hide it. The
# registry is keyed by session anyway, so one host instance serves every
# session. What a preset chooses is whether its agent can call the goal tool.
- id: tool-goal
  name: '@fathom/tool-goal'

# ── findings ─────────────────────────────────────────────────────────────────

# Model-facing only. The store is a plain file in the session folder, keyed by
# the calling agent's session, so one host instance serves every session and no
# realm is needed — like the filesystem tools above. What a preset chooses is
# whether its agent can record structured findings and write a report.
- id: tool-findings
  name: '@fathom/tool-findings'

# ── engagement map + recorded traffic ────────────────────────────────────────

# Model-facing only, file-backed like findings: a workspace-shared asset graph
# (.engagement/assets.json), a per-session exploration graph anchored to it
# (coverage), and http_request, which records every exchange under traffic/ so
# record_finding can bind it as evidence (traffic_id).
- id: tool-engagement
  name: '@fathom/tool-engagement'

# ── autonomy brakes ──────────────────────────────────────────────────────────

# Scope gate (set_scope/show_scope; out-of-scope hosts are denied), rule-based
# approval for high-impact commands, a target noise governor, and
# untrusted-output framing — all on the tools pre/post-execute waterfalls of
# this preset's agents.
- id: pentest-guard
  name: '@fathom/pentest-guard'

# ── shared memory: prior-session + cross-agent trace search ──────────────────

# Model-facing only. `ctx.sessionQuery` and its SQLite full-text backend are
# host-plane (mounted in the base bundle), so this row just exposes the tools to
# the agent — like tool-goal above. It lets an agent and its subagents search
# what other agents and past engagements in this workspace already tried, found,
# or ruled out (ARTEX's cross-worker trace search), and trace session lineage.
- id: tool-session-query
  name: '@fathom/tool-session-query'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@fathom/plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    # Token economy: pentest sessions are dominated by bulky tool output (HTTP
    # bodies, scan results) that every later step re-sends. Compact to keep a
    # small verbatim tail instead of riding a 200K window to 80% — but not so
    # early that a long run is re-summarized a dozen times, since each pass
    # condenses the previous summary and erodes early detail. 0.65 of a 200K
    # window compacts near ~130K, roughly halving the number of generations a
    # long engagement goes through versus 0.5.
    - id: compaction-basic
      name: '@fathom/compaction-basic'
      config:
        thresholdRatio: 0.65
        retainRatio: 0.05
        # Headroom for a reasoning summarizer: it spends tokens thinking before
        # it writes, so 4096 truncated summaries and once produced none at all.
        maxTokens: 8192
        # Not editable here: Settings edits the pentest preset's copy (one
        # settings namespace per process).
        settings: false

    - id: command-compact
      name: '@fathom/command-compact'

    - id: tool-result-pruner
      name: '@fathom/compaction-tool-result-pruner'
      config:
        thresholdChars: 3000
        headChars: 1500
        tailChars: 500
        settings: false

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
#
# `tool-subagent-report` is host-plane for the same reason as the registry,
# not because a preset may not want it: it registers a CONTINUABLE SETUP on
# that singleton rather than a tool this agent calls, and the setup list is
# not scope-aware — one copy per mounted preset means every child gets
# `report` registered once per live session, which throws on the second.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@fathom/tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@fathom/tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@fathom/tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@fathom/tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Production fathom does not install these optional providers. Install the
    # matching Bundle in this Profile and restart the Host, then copy this
    # preset and remove `disabled` from the matching tool row. Host availability
    # alone grants no tool.
    - id: tool-subagent-codex
      name: '@fathom/tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@fathom/tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@fathom/workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@fathom/tool-workflow'

    - id: tool-ralph
      name: '@fathom/tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@fathom/tool-ask-user'

- id: tool-todo
  name: '@fathom/tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@fathom/tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# Browser tools (browser_navigate, browser_read_page, browser_computer, …) over
# the shared browser the host plane owns; the user watches the same tabs in the
# Browser pane and can take over.
- id: tool-browser
  name: '@fathom/tool-browser'
  config:
    maxChars: 40000

# Self-installing pentest toolkit (pentest_tools): reports which tools exist and
# installs missing ones, asking the user once whether to use WSL or Windows.
- id: pentest-toolkit
  name: '@fathom/pentest-toolkit'
