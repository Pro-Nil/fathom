<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pentest Harness</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0d; color: #e8e8ec;
    font: 14px/1.4 Inter, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; }
  body {
    display: grid; place-items: center;
    background:
      radial-gradient(140% 90% at 35% -20%, rgba(255,255,255,.07), transparent 55%),
      linear-gradient(rgba(9,9,11,.48), rgba(9,9,11,.48)),
      linear-gradient(27deg, #121215 5px, transparent 5px) 0 5px / 20px 20px,
      linear-gradient(207deg, #121215 5px, transparent 5px) 10px 0 / 20px 20px,
      linear-gradient(27deg, #1f1f24 5px, transparent 5px) 0 10px / 20px 20px,
      linear-gradient(207deg, #1f1f24 5px, transparent 5px) 10px 5px / 20px 20px,
      linear-gradient(90deg, #18181c 10px, transparent 10px) 0 0 / 20px 20px,
      linear-gradient(#1a1a1e 25%, #16161a 25%, #16161a 50%, transparent 50%, transparent 75%, #222227 75%, #222227) 0 0 / 20px 20px,
      #0b0b0d;
  }
  .card { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; max-width: 520px; padding: 24px; }
  svg { width: 56px; height: 56px; color: #ececf0; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  h1 span { font-weight: 400; color: #9a9aa4; }
  .status { color: #9a9aa4; min-height: 20px; }
  .bar { width: 180px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: #3b82f6; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  .error .bar { display: none; }
  .error .status { color: #ffb4b4; white-space: pre-wrap; }
  .hint { color: #6b6b75; font-size: 12px; }
</style>
</head>
<body>
<div class="card" id="card">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
    <path d="M12 2.5 19 5v6c0 4.9-2.8 8.6-7 10.5C7.8 19.6 5 15.9 5 11V5l7-2.5Z"/>
    <circle cx="12" cy="11" r="3.4"/>
    <path d="M12 5.6v2M12 14.4v2M5.6 11h2M14.4 11h2" stroke-linecap="round"/>
    <circle cx="12" cy="11" r="1.1" fill="#3b82f6" stroke="none"/>
  </svg>
  <h1>Pentest <span>Harness</span></h1>
  <div class="bar"><i></i></div>
  <div class="status" id="status">Starting the harness…</div>
  <div class="hint" id="hint"></div>
</div>
<script>
  window.setStatus = (text, isError, hint) => {
    document.getElementById('status').textContent = text
    document.getElementById('hint').textContent = hint || ''
    document.getElementById('card').classList.toggle('error', !!isError)
  }
</script>
</body>
</html>
