<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fathom</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0e14; color: #e8e8ec;
    font: 14px/1.4 Inter, 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(120% 80% at 50% -10%, rgba(45,212,191,.08), transparent 60%), #0a0e14;
  }
  .card { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; max-width: 520px; padding: 24px; }
  svg { width: 56px; height: 56px; color: #ececf0; }
  h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  .status { color: #9a9aa4; min-height: 20px; }
  .bar { width: 180px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: #2DD4BF; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  .error .bar { display: none; }
  .error .status { color: #ffb4b4; white-space: pre-wrap; }
  .hint { color: #6b6b75; font-size: 12px; }
  /* Windows: the window has no native caption while the page's bar is not
     up yet, so the whole splash drags the window. */
  html { app-region: drag; -webkit-app-region: drag; }
</style>
</head>
<body>
<div class="card" id="card">
  <svg viewBox="0 0 24 24" fill="none">
    <path d="M9.9 3.4a2.1 2.1 0 1 0 4.2 0a2.1 2.1 0 1 0 -4.2 0Z" fill="#2DD4BF"/>
    <path d="M18.269 6.733A7.100 7.100 0 0 1 5.731 6.733A1.100 1.100 0 0 1 7.674 5.700A4.900 4.900 0 0 0 16.326 5.700A1.100 1.100 0 0 1 18.269 6.733Z" fill="#2DD4BF"/>
    <path d="M17.312 13.825A11.700 11.700 0 0 1 6.688 13.825A1.100 1.100 0 0 1 7.687 11.865A9.500 9.500 0 0 0 16.313 11.865A1.100 1.100 0 0 1 17.312 13.825Z" fill="#2DD4BF" fill-opacity="0.72"/>
    <path d="M15.528 19.314A16.300 16.300 0 0 1 8.472 19.314A1.100 1.100 0 0 1 8.948 17.166A14.100 14.100 0 0 0 15.052 17.166A1.100 1.100 0 0 1 15.528 19.314Z" fill="#2DD4BF" fill-opacity="0.45"/>
  </svg>
  <h1>Fathom</h1>
  <div class="bar"><i></i></div>
  <div class="status" id="status">Starting Fathom…</div>
  <div class="hint" id="hint"></div>
</div>
<script>
  window.setStatus = (text, isError, hint) => {
    document.getElementById('status').textContent = text
    document.getElementById('hint').textContent = hint || ''
    document.getElementById('card').classList.toggle('error', !!isError)
  }
</script>
</body>
</html>
